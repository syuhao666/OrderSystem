<style>
    .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
    }

    .logo {
        font-size: 1.5rem;
        font-weight: bold;
    }

    .nav {
        display: flex;
        gap: 15px;
    }

    .nav a {
        text-decoration: none;
        color: #333;
    }

    .menu-toggle {
        display: none;
        font-size: 1.5rem;
        cursor: pointer;
    }

    /* 響應式：手機版 */
    @media (max-width: 768px) {
        .nav {
            display: none;
            flex-direction: column;
            background: #fff;
            position: absolute;
            top: 60px;
            right: 20px;
            border: 1px solid #ddd;
            padding: 10px;
        }

        .nav.active {
            display: flex;
        }

        .menu-toggle {
            display: block;
        }
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const toggle = document.querySelector(".menu-toggle");
        const nav = document.querySelector(".nav");
        if (toggle) {
            toggle.addEventListener("click", () => {
                nav.classList.toggle("active");
            });
        }
    });
</script>
